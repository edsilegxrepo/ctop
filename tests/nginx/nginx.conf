# NGINX Reverse Proxy Configuration for ctop Web Telemetry E2E Tests
#
# Supports:
# 1. Plain HTTP Insecure Proxy on port 19080 (for testing 403 Forbidden rejection of unencrypted remote traffic)
# 2. SSL/TLS Terminating Reverse Proxy on port 19443 (for testing Bearer auth, session login, and live SSE streaming)

worker_processes 1;
pid /tmp/nginx_ctop_test.pid;
error_log /tmp/nginx_ctop_error.log info;

events {
    worker_connections 128;
}

http {
    access_log /tmp/nginx_ctop_access.log;
    client_body_temp_path /tmp/nginx_body_temp;
    proxy_temp_path /tmp/nginx_proxy_temp;
    fastcgi_temp_path /tmp/nginx_fcgi_temp;
    uwsgi_temp_path /tmp/nginx_uwsgi_temp;
    scgi_temp_path /tmp/nginx_scgi_temp;

    # 1. Insecure HTTP Proxy (Forwards X-Forwarded-Proto: http)
    # ctop must reject unencrypted remote requests with 403 Forbidden
    server {
        listen 127.0.0.1:19080;
        server_name localhost;

        location /probe/ {
            proxy_pass http://127.0.0.1:19090/probe/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
        }
    }

    # 2. Secure SSL/TLS Terminating Reverse Proxy (Forwards X-Forwarded-Proto: https)
    server {
        listen 127.0.0.1:19443 ssl;
        server_name localhost;

        ssl_certificate tests/tls/server.crt;
        ssl_certificate_key tests/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /probe/ {
            proxy_pass http://127.0.0.1:19090/probe/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }
    }
}
